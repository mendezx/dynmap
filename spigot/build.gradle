jar {
    archiveClassifier = 'unshaded'
}

shadowJar {
    dependsOn project(':DynmapCore').tasks.named('shadowJar')

    dependencies {
        include(dependency('org.bstats:bstats-bukkit:.*'))
        include(dependency('org.bstats:bstats-base:.*'))
        include(dependency(':dynmap-api'))
        include(dependency(":DynmapCore"))
        include(dependency(':bukkit-helper'))
        include(dependency(':bukkit-helper-113-2'))
        include(dependency(':bukkit-helper-114-1'))
        include(dependency(':bukkit-helper-115'))
        include(dependency(':bukkit-helper-116'))
        include(dependency(':bukkit-helper-116-2'))
        include(dependency(':bukkit-helper-116-3'))
        include(dependency(':bukkit-helper-116-4'))
        include(dependency(':bukkit-helper-117'))
        include(dependency(':bukkit-helper-118'))
        include(dependency(':bukkit-helper-118-2'))
        include(dependency(':bukkit-helper-119'))
        include(dependency(':bukkit-helper-119-3'))
        include(dependency(':bukkit-helper-119-4'))
        include(dependency(':bukkit-helper-120'))
        include(dependency(':bukkit-helper-120-2'))
        include(dependency(':bukkit-helper-120-4'))
        include(dependency(':bukkit-helper-120-5'))
        include(dependency(':bukkit-helper-121'))
        include(dependency(':bukkit-helper-121-3'))
        include(dependency(':bukkit-helper-121-4'))
        include(dependency(':bukkit-helper-121-5'))
        include(dependency(':bukkit-helper-121-6'))
        include(dependency(':bukkit-helper-121-10'))
        include(dependency(':bukkit-helper-121-11'))
        include(dependency(':bukkit-helper-261-2'))
    }
    relocate('org.bstats', 'org.dynmap.bstats')
    destinationDirectory = file '../target'
    archiveBaseName = "Dynmap"
    archiveClassifier = 'spigot'
}
shadowJar.doLast {
    task ->
        def jarFile = task.archiveFile.get().asFile
        ant.checksum file: jarFile

        def requiredRelocatedEntries = [
                'org/dynmap/jetty/util/log/Logger.class',
                'org/dynmap/jetty/server/Server.class',
                'org/dynmap/jetty/servlet/ServletHolder.class',
                'org/dynmap/javax/servlet/Servlet.class',
                'org/dynmap/bstats/charts/CustomChart.class',
                'org/dynmap/bstats/bukkit/Metrics.class'
        ]
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            def missingEntries = requiredRelocatedEntries.findAll { zipFile.getEntry(it) == null }
            if (!missingEntries.isEmpty()) {
                throw new GradleException("Missing relocated dependency classes in ${jarFile}: ${missingEntries.join(', ')}")
            }
        } finally {
            zipFile.close()
        }
}

artifacts {
    archives shadowJar
}
